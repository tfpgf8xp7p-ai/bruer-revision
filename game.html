<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Daily English V6.0</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <style>
    :root {
      --primary: #4DA8E8; --accent: #FFD200; --bg: #F0F4F8; --text: #1E2B3C;
      --success: #4CAF50; --error: #F44336; --warning: #FF9500;
      --shadow: 0 3px 12px rgba(0,0,0,0.08); --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; justify-content: center; align-items: center; padding: 12px; line-height: 1.5;
    }
    .screen { width: 100%; max-width: 460px; text-align: center; }
    .card-box { background: white; border-radius: 24px; padding: 20px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    h1 { font-size: 1.5rem; margin-bottom: 4px; color: var(--primary); }
    h2 { font-size: 1rem; color: var(--primary); margin-bottom: 10px; }
    .subtitle { color: #555; margin-bottom: 16px; font-size: 0.85rem; }
    .btn {
      display: block; width: 100%; padding: 13px; margin: 8px 0; border: none;
      border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer;
      background: var(--accent); color: var(--text); box-shadow: 0 4px 12px rgba(255,210,0,0.3); transition: all 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.small { display: inline-block; width: auto; padding: 7px 14px; font-size: 12px; margin: 3px; }
    .btn.blue { background: var(--primary); color: white; }
    .btn.green { background: #81C784; color: white; }
    .btn.gray { background: #e0e0e0; color: #555; }
    .btn.red { background: #FF6B6B; color: white; }
    .btn.purple { background: #9C27B0; color: white; }
    .btn.orange { background: #FF9800; color: white; }
    .type-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    @media (max-width: 380px) { .type-select { grid-template-columns: repeat(2, 1fr); } }
    .type-card {
      background: white; border-radius: 14px; padding: 12px 6px; text-align: center;
      border: 2px solid #ddd; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .type-card:active { transform: scale(0.96); }
    .type-card .emoji { font-size: 1.6rem; display: block; margin-bottom: 4px; }
    .type-card .label { font-size: 0.7rem; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; }
    .card {
      aspect-ratio: 3/3.5; border-radius: var(--radius); display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 0.8rem; padding: 4px; cursor: pointer;
      box-shadow: var(--shadow); background: white; color: var(--text); text-align: center;
      transition: all 0.2s; word-break: break-word; line-height: 1.2;
    }
    .card.en { background: #E6F4FF; color: #2962FF; }
    .card.zh { background: #FFF8E6; color: #E65100; }
    .card.selected { transform: scale(0.9); box-shadow: 0 0 0 3px var(--primary); }
    .card.matched { opacity: 0.3; transform: scale(0.8); background: var(--success)!important; color: white!important; pointer-events:none; }
    .card.wrong { animation: shake 0.5s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-5px)} }
    .info-bar { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 12px; color: #555; }
    .progress { height: 6px; background: #E0E7FF; border-radius: 3px; overflow: hidden; flex: 1; margin: 0 8px; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; width: 0%; transition: width 0.4s; }
    .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 24px; padding: 24px; width: 90%; max-width: 380px; text-align: center; max-height: 85vh; overflow-y: auto; }
    .unit-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .unit-tag { padding: 6px 12px; border-radius: 20px; border: 2px solid #ddd; font-size: 0.75rem; cursor: pointer; background: white; }
    .unit-tag.active { background: var(--accent); border-color: var(--accent); font-weight: 700; }
    .option-btn {
      display: block; width: 100%; padding: 12px; margin: 6px 0; border: 2px solid #ddd; border-radius: 14px;
      font-size: 0.9rem; font-weight: 600; background: white; cursor: pointer; transition: 0.2s; text-align: left;
    }
    .option-btn:active { transform: scale(0.97); }
    .option-btn.correct { border-color: var(--success); background: #e8f8ee; }
    .option-btn.wrong { border-color: var(--error); background: #fff0f0; }
    .dialogue-box { background: #f8fafc; border-radius: 16px; padding: 16px; margin: 12px 0; border: 2px solid #e2e8f0; text-align: left; }
    .dialogue-line { padding: 8px 12px; margin: 4px 0; border-radius: 10px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .dialogue-line.a { background: #E6F4FF; color: #1a56db; }
    .dialogue-line.b { background: #FFF8E6; color: #b45309; }
    .dialogue-line .speaker { font-weight:700; font-size:0.7rem; min-width:35px; }
    .scene-img { width: 100%; max-height:180px; object-fit: contain; border-radius:12px; background: #f0f0f0; margin: 8px 0; }
    .syllable-box {
      background: #F0F4FF; border-radius: 12px; padding: 12px; margin: 10px 0;
      font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: #2962FF; animation: fadeInUp 0.3s ease;
    }
    .phonetic-text { font-size: 1rem; font-weight: 500; color: #888; letter-spacing: 1px; margin-top: 2px; }
    @keyframes fadeInUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .word-row { margin:6px 0; padding:6px; background:white; border-radius:8px; transition: all 0.2s; }
    .word-row.highlight { background: #FFF9C4; font-weight:800; }
    .word-row.highlight .en-text { color: #D32F2F; }
    .letter-display { font-size: 5rem; font-weight: 900; color: var(--primary); margin: 16px 0; }
    .phonetic-option { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .recording-indicator { width: 20px; height: 20px; border-radius: 50%; background: var(--error); animation: pulse 1s infinite; display: inline-block; margin-right: 8px; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .input-box {
      width: 100%; padding: 13px; border: 2px solid #ddd; border-radius: 14px;
      font-size: 1.1rem; text-align: center; margin: 8px 0; outline: none; letter-spacing: 1px;
    }
    .feedback-bar { padding: 10px; border-radius: 12px; margin: 8px 0; font-weight: 700; font-size: 0.9rem; }
    .feedback-bar.success { background: #e8f8ee; color: #1a7f3f; }
    .feedback-bar.error { background: #fff0f0; color: #c62828; }
    .feedback-bar.info { background: #fff8e1; color: #e65100; }
    .hidden { display: none!important; }
    .text-sm { font-size: 0.8rem; }
    .text-xs { font-size: 0.7rem; }
    .mt-8 { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .text-left { text-align: left; }
  </style>
</head>
<body>

<!-- 登录界面 -->
<div id="loginScreen" class="screen">
  <div class="card-box">
    <h1>📘 Daily English V6.0</h1>
    <p class="subtitle">选择学习身份</p>
    <button class="btn" id="btnNora">Nora</button>
    <button class="btn" id="btnJoen">Joen</button>
    <button class="btn secondary" id="btnGuest">👤 访客体验</button>
    <p style="margin-top:14px; font-size:0.7rem; color:#aaa;" id="btnTeacherEntry">🔧 教师设定</p>
  </div>
</div>

<!-- 教师密码验证 -->
<div id="passwordModal" class="modal hidden">
  <div class="modal-content">
    <h2>🔐 教师验证</h2>
    <input type="password" class="input-box" id="teacherPasswordInput" placeholder="输入密码" autocomplete="off" />
    <p class="text-xs" style="color:#f66;min-height:18px;" id="passwordError"></p>
    <button class="btn" onclick="verifyTeacherPassword()">确认</button>
    <button class="btn small gray" onclick="document.getElementById('passwordModal').classList.add('hidden')">取消</button>
  </div>
</div>

<!-- 教师面板 -->
<div id="teacherScreen" class="screen hidden">
  <div class="card-box" style="max-height:85vh; overflow-y:auto;">
    <h1>🔧 教师后台</h1>
    <h3 class="text-left mt-8">📚 本周教学单元</h3>
    <div class="unit-tags" id="unitTags"></div>
    <button class="btn small blue" onclick="saveTeacherSettings()">💾 保存单元</button>
    <h3 class="text-left mt-8">🎮 开放题型</h3>
    <div id="typeSettings" style="text-align:left; margin:8px 0;"></div>
    <button class="btn small blue" onclick="saveTypeSettings()">💾 保存题型</button>
    <h3 class="text-left mt-8">📊 学习数据</h3>
    <div id="teacherDataPanel"></div>
    <h3 class="text-left mt-8">🔑 修改密码</h3>
    <input type="password" class="input-box" id="newPasswordInput" placeholder="新密码" />
    <button class="btn small red" onclick="changeTeacherPassword()">更新密码</button>
    <button class="btn small gray mt-8" onclick="document.getElementById('teacherScreen').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');">← 返回</button>
  </div>
</div>

<!-- 题型选择界面 -->
<div id="typeSelectScreen" class="screen hidden">
  <div class="card-box">
    <h1>📘 Daily English</h1>
    <h2 id="typeSelectStudentName">Nora</h2>
    <p class="subtitle">选择练习题型</p>
    <div class="type-select" id="typeSelectGrid"></div>
    <button class="btn small gray" id="btnBackToLogin">← 返回</button>
  </div>
</div>

<!-- 游戏界面 -->
<div id="gameScreen" class="screen hidden">
  <div class="card-box">
    <h1>📘 Daily English</h1>
    <h2 id="studentName">Nora</h2>
    <p style="font-size:0.75rem;color:#888;" id="taskInfo">今日复习任务</p>
    <div class="info-bar">
      <span>⏱ <span id="timer">00:00</span></span>
      <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      <span>✅ <span id="matchCount">0/8</span></span>
    </div>
    <div id="questionArea"></div>
    <div id="feedbackArea"></div>
    <button class="btn blue" id="btnNextQuestion" style="display:none;">➡️ 下一组</button>
    <button class="btn small gray mt-8" id="btnBackToTypeSelect">← 换题型</button>
  </div>
</div>

<!-- 排行榜弹窗 -->
<div id="leaderboardModal" class="modal hidden">
  <div class="modal-content">
    <h2>🏆 学习排行榜</h2>
    <p><strong>Nora</strong>：<span id="noraScore">0</span> ⚡</p>
    <p><strong>Joen</strong>：<span id="joenScore">0</span> ⚡</p>
    <p style="color:#999;">你们一起在战斗！💪</p>
    <button class="btn small" onclick="document.getElementById('leaderboardModal').classList.add('hidden')">关闭</button>
  </div>
</div>

<!-- 错题本弹窗 -->
<div id="reviewModal" class="modal hidden">
  <div class="modal-content">
    <h2>📝 错题本</h2>
    <div id="reviewList" style="text-align:left;max-height:300px;overflow-y:auto;margin:12px 0;"></div>
    <button class="btn small" onclick="document.getElementById('reviewModal').classList.add('hidden')">关闭</button>
  </div>
</div>

<!-- 结果弹窗 -->
<div id="resultModal" class="modal hidden">
  <div class="modal-content">
    <h2>🎉 复习完成！</h2>
    <div id="starsDisplay" style="font-size:2rem;">⭐⭐⭐</div>
    <p id="rankText" style="font-weight:600;"></p>
    <div style="display:flex;justify-content:space-around;margin:14px 0;">
      <div>正确率<br><span style="font-size:1.2rem;font-weight:700;color:#4DA8E8;" id="accuracyValue">100%</span></div>
      <div>获得<br><span style="font-size:1.2rem;font-weight:700;color:#FF9500;" id="energyValue">+10</span> ⚡</div>
    </div>
    <button class="btn" id="btnPlayAgain">再学一轮</button>
    <button class="btn small gray" id="btnResultClose">返回</button>
  </div>
</div>

<script>
// ===================== 音频引擎 =====================
const AudioPreloader = {
  cache: {},
  preloadWords(arr) { arr.forEach(w => { const en = w[0]||w.en||w; if(!this.cache[en]){ const a=new Audio(); a.src=`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(en)}&type=2`; a.load(); this.cache[en]=a; } }); },
  play(w) { const word = typeof w === 'string' ? w : (w[0]||w.en||''); if(this.cache[word]){ this.cache[word].currentTime=0; this.cache[word].play().catch(()=>this.fb(word)); } else this.fb(word); },
  fb(w){ const a=new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(w)}&type=2`); a.play().catch(()=>{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=0.85; speechSynthesis.speak(u); } }); }
};
function speakWord(w) { AudioPreloader.play(w); }

// ===================== 教师密码 =====================
const DEFAULT_PASSWORD = 'bruer2026';
function getTeacherPassword() { return localStorage.getItem('teacher_password') || DEFAULT_PASSWORD; }
function verifyTeacherPassword() {
  if (document.getElementById('teacherPasswordInput').value === getTeacherPassword()) {
    document.getElementById('passwordModal').classList.add('hidden');
    document.getElementById('teacherScreen').classList.remove('hidden');
    document.getElementById('loginScreen').classList.add('hidden');
    renderTeacherPanel();
  } else { document.getElementById('passwordError').textContent = '密码错误'; }
}
function changeTeacherPassword() { const p=document.getElementById('newPasswordInput').value.trim(); if(p.length<4){alert('至少4位');return;} localStorage.setItem('teacher_password',p); alert('✅ 密码已更新'); }

function setWordHistory(stu,key,correct){ const h=getWordHistory(stu,key)||{learnedDates:[],correctStreak:0,lastReviewed:null}; const t=new Date().toISOString().split('T')[0]; if(!h.learnedDates.includes(t)) h.learnedDates.push(t); if(correct){h.correctStreak++;h.lastReviewed=t;}else h.correctStreak=0; LS.set(`daily_${stu}_history_${key}`,h); }

// ===================== 出题 =====================
function getWordsForReview(stu){
  const sel=getTeacherSelectedUnits(); let pool=[]; sel.forEach(u=>{if(FULL_KNOWLEDGE_BASE[u]) pool=pool.concat(FULL_KNOWLEDGE_BASE[u]);}); pool=pool.filter((w,i)=>pool.findIndex(x=>x[0]===w[0])===i);
  const t=new Date(), y=new Date(t-86400000).toISOString().split('T')[0], d3=new Date(t-86400000*3).toISOString().split('T')[0], w1=new Date(t-86400000*7).toISOString().split('T')[0];
  let rec=[],mid=[],old=[],err=[],fresh=[];
  pool.forEach(w=>{ const k=w[0],h=getWordHistory(stu,k); if(!h){fresh.push(w);return;} const r=LS.get(`daily_${stu}_review`,[]),ir=r.find(x=>x.en===k); if(ir&&ir.count>0&&h.correctStreak<3){err.push(w);return;} if(h.learnedDates.includes(y)) rec.push(w); else if(h.learnedDates.includes(d3)) mid.push(w); else if(h.learnedDates.includes(w1)) old.push(w); });
  let sel2=[], sf=a=>a.sort(()=>Math.random()-0.5); sel2=sel2.concat(sf(err).slice(0,3),sf(rec).slice(0,3),sf(mid).slice(0,2),sf(old).slice(0,1)); if(sel2.length<8) sel2=sel2.concat(sf(fresh).slice(0,8-sel2.length)); while(sel2.length<8){ const e=pool[Math.floor(Math.random()*pool.length)]; if(!sel2.find(s=>s[0]===e[0])) sel2.push(e); } return sel2.slice(0,8);
}
function getDialoguesForReview(stu){
  const sel=getTeacherSelectedUnits(); let pool=[]; sel.forEach(u=>{ if(DIALOGUE_BASE[u]) DIALOGUE_BASE[u].dialogues.forEach(d=>pool.push({...d,unit:u,level:DIALOGUE_BASE[u].level})); });
  return pool.sort(()=>Math.random()-0.5).slice(0,6);
}
function getPhonicsQuestions(){ return shuffleArr([...LETTER_PHONICS]).slice(0,6); }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }

  document.getElementById('studentName').textContent=student==='Guest'?'Guest':student;

  clearInterval(timerId); document.getElementById('timer').textContent='00:00';

}

function loadNextQ(){
  const totalQ = currentType==='dialogue'||currentType==='phonics'||currentType==='repeat' ? 6 : Q_PER_ROUND;
  if(currentIdx>=totalQ){endGame();return;}
  resetQ();
  if(currentType==='match') showMatchQ(currentWords[currentIdx]);
  else if(currentType==='listen') showListenQ(currentWords[currentIdx]);
  else if(currentType==='fill') showFillQ(currentWords[currentIdx]);
  else if(currentType==='dialogue') showDialogueQ(currentWords[currentIdx]);
  else if(currentType==='phonics') showPhonicsQ(currentWords[currentIdx]);
  else if(currentType==='repeat') showRepeatQ(currentWords[currentIdx]);

function showMatchQ(cw){ const area=document.getElementById('questionArea'); const pool=Object.values(FULL_KNOWLEDGE_BASE).flat(); const tp=8, sp=[cw], uk=new Set([cw[0]]); const ow=shuffleArr(pool.filter(w=>!uk.has(w[0]))); for(const w of ow){if(sp.length>=tp)break;if(!uk.has(w[0])){sp.push(w);uk.add(w[0]);}} window._cmp=sp; window._mpk=new Set(); let cards=[]; sp.forEach(p=>{cards.push({type:'en',text:p[0],pk:p[0],pz:p[1]});cards.push({type:'zh',text:p[1],pk:p[0],pz:p[1]});}); cards=shuffleArr(cards); area.innerHTML=`<p style="font-weight:600;">🔤 消消乐 · ${tp}对</p><p style="font-size:0.8rem;color:#888;">点击英文→中文</p><div class="grid">${cards.map((c,i)=>`<div class="card ${c.type}" data-i="${i}" data-pk="${c.pk}" data-type="${c.type}" data-text="${c.text}" onclick="handleMC(this)">${c.text}</div>`).join('')}</div>`; window._ms=null; }
window.handleMC=function(el){if(qAnswered||el.classList.contains('matched'))return;const pk=el.dataset.pk,type=el.dataset.type;if(!window._ms){if(type==='en'){window._ms=el;el.classList.add('selected');}return;}const f=window._ms;if(f===el){f.classList.remove('selected');window._ms=null;return;}if(f.dataset.type===type){f.classList.remove('selected');f.classList.add('wrong');el.classList.add('wrong');setTimeout(()=>{f.classList.remove('wrong');el.classList.remove('wrong');},400);window._ms=null;return;}if(f.dataset.pk===pk){attempts++;correctCount++;f.classList.remove('selected');f.classList.add('matched');el.classList.add('matched');window._mpk.add(pk);const ew=f.dataset.type==='en'?f.dataset.text:el.dataset.text;speakWord(ew);if(window._mpk.size>=window._cmp.length){qAnswered=true;clearTimeout(qTimeout);showSylAll(window._cmp);showFB('success','✅ 全部完成！');showNextB();}window._ms=null;}else{attempts++;f.classList.remove('selected');f.classList.add('wrong');el.classList.add('wrong');setTimeout(()=>{f.classList.remove('wrong');el.classList.remove('wrong');},400);qAtt++;const ww=f.dataset.type==='en'?f.dataset.text:el.dataset.text,wp=window._cmp.find(w=>w[0]===ww)||window._cmp[0];recordErrW(wp);if(qAtt>=MAX_ATT*window._cmp.length)skipQ('已达最大尝试次数');else showFB('error','❌ 不匹配！');window._ms=null;}};

function playAll(){ if(!window._pwq||!window._pwq.length)return; let delay=0; window._pwq.forEach((w,i)=>{setTimeout(()=>{speakWord(w);const rows=document.querySelectorAll('.word-row');rows.forEach(r=>r.classList.remove('highlight'));const row=document.getElementById('wr-'+i);if(row)row.classList.add('highlight');},delay);delay+=2500;}); }

// ---------- 听音选词 ----------
function showListenQ(w){ const area=document.getElementById('questionArea'); const pool=Object.values(FULL_KNOWLEDGE_BASE).flat(); const wr=shuffleArr(pool.filter(x=>x[0]!==w[0]).slice(0,3)); const opts=shuffleArr([w,...wr.slice(0,3)]); area.innerHTML=`<p style="font-weight:600;">🔊 听音选词</p><button class="btn small blue" onclick="speakWord('${w[0]}')">🔊 再听</button><div style="margin-top:8px;">${opts.map(o=>`<button class="option-btn" onclick="handleLC('${o[0]}','${w[0]}',this)">${o[0]}</button>`).join('')}</div>`; setTimeout(()=>speakWord(w[0]),500); }
window.handleLC=function(sel,cor,el){if(qAnswered)return;attempts++;if(sel===cor){qAnswered=true;clearTimeout(qTimeout);correctCount++;el.classList.add('correct');showSyl(currentWords[currentIdx]);showFB('success','✅ 正确！');showNextB();}else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500);qAtt++;recordErrW(currentWords[currentIdx]);if(qAtt>=MAX_ATT)skipQ('已达最大尝试次数');else showFB('error',`❌ 剩余${MAX_ATT-qAtt}次`);}};

// ---------- 字母填空 ----------
function getFillLv(){if(student==='Guest')return 1;return LS.get(`daily_${student}_fillLevel`,1);}
function updateFillLv(cor){if(student==='Guest')return;const cl=getFillLv(),k=`daily_${student}_fillHistory`,h=LS.get(k,[]);h.push({cor,date:new Date().toISOString().split('T')[0]});if(h.length>10)h.shift();LS.set(k,h);const rc=h.filter(x=>x.cor).length;if(rc>=8&&cl<3)LS.set(`daily_${student}_fillLevel`,cl+1);else if(rc<=3&&cl>1)LS.set(`daily_${student}_fillLevel`,cl-1);}
function genFillBl(w){const en=w[0],len=en.length,lv=getFillLv();if(len<=2)return{blank:en[0]+'_',ans:en};let ba=en.split(''),mc=lv===1?Math.min(2,Math.max(1,Math.floor(len*.25))):lv===2?Math.min(len-1,Math.max(2,Math.floor(len*.5))):Math.min(len-1,Math.max(3,Math.floor(len*.75)));const idx=[];for(let i=0;i<len;i++){if(en[i]!==' '&&en[i]!=='-'&&en[i]!=="'")idx.push(i);}const sf=shuffleArr([...idx]),th=sf.slice(0,Math.min(mc,sf.length));th.forEach(i=>{ba[i]='_';});const bk=ba.join('');if(!bk.includes('_')){const si=idx.find(i=>i!==0&&i!==len-1)||idx[Math.floor(idx.length/2)];ba[si]='_';}return{blank:ba.join(''),ans:en};}
function showFillQ(w){const{blank}=genFillBl(w),lv=getFillLv(),ln={1:'⭐入门',2:'⭐⭐进阶',3:'⭐⭐⭐挑战'};const area=document.getElementById('questionArea');area.innerHTML=`<p style="font-weight:600;">✏️ 字母填空 ${ln[lv]}</p><p style="font-size:0.85rem;color:#888;">中文：<strong>${w[1]}</strong></p><div style="font-size:2rem;letter-spacing:8px;margin:16px 0;font-weight:700;color:#2962FF;">${blank}</div><input type="text" class="input-box" id="fillInput" placeholder="输入完整单词" autocomplete="off" /><div style="display:flex;gap:8px;margin-top:8px;"><button class="btn small blue" onclick="handleFS('${w[0]}')" style="flex:1;">提交</button><button class="btn small gray" onclick="skipQ('已跳过')" style="flex:1;">我不会</button></div><button class="btn small blue mt-8" onclick="speakWord('${w[0]}')">🔊 再听</button>`;setTimeout(()=>{speakWord(w[0]);document.getElementById('fillInput')?.focus();},300);document.getElementById('fillInput')?.addEventListener('keydown',function(e){if(e.key==='Enter')handleFS(w[0]);});window._fw=w;}
window.handleFS=function(ca){if(qAnswered)return;const inp=document.getElementById('fillInput');if(!inp||!inp.value.trim())return;attempts++;if(inp.value.trim().toLowerCase()===ca.toLowerCase()){qAnswered=true;clearTimeout(qTimeout);correctCount++;inp.style.borderColor='var(--success)';inp.style.background='#e8f8ee';updateFillLv(true);showSyl(window._fw);showFB('success','✅ 正确！');showNextB();}else{inp.style.borderColor='var(--error)';inp.style.background='#fff0f0';setTimeout(()=>{inp.style.borderColor='#ddd';inp.style.background='white';},500);qAtt++;updateFillLv(false);recordErrW(window._fw);if(qAtt>=MAX_ATT)skipQ('已达最大尝试次数');else showFB('error',`❌ 剩余${MAX_ATT-qAtt}次`);}};

// ---------- 情景对话 ----------
function showDialogueQ(d){ const area=document.getElementById('questionArea'); const linesHTML=d.lines.map(l=>`<div class="dialogue-line ${l.speaker==='A'?'a':'b'}"><span class="speaker">${l.speaker==='A'?'👦':'👧'}</span>${l.text}</div>`).join(''); area.innerHTML=`<div class="text-sm" style="color:#888;">💬 情景对话 · ${d.scene}</div>${d.img?`<img src="${d.img}" class="scene-img" alt="${d.scene}" onerror="this.style.display='none'" />`:''}<div class="dialogue-box">${linesHTML}</div><p style="font-weight:600;">选择正确的应答：</p>${d.options.map((o,i)=>`<button class="option-btn" onclick="handleDC(${i},${d.correct},this,'${d.options[d.correct].replace(/'/g,"\\'")}')">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}`; }
window.handleDC=function(sel,cor,el,correctText){if(qAnswered)return;attempts++;if(sel===cor){qAnswered=true;clearTimeout(qTimeout);correctCount++;el.classList.add('correct');speakWord(correctText);showFB('success','✅ 正确！');showNextB();}else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500);qAtt++;if(qAtt>=MAX_ATT)skipQ('已达最大尝试次数');else showFB('error',`❌ 剩余${MAX_ATT-qAtt}次`);}};

// ---------- 字母发音练习 ----------
function showPhonicsQ(p){ const area=document.getElementById('questionArea'); area.innerHTML=`<div class="text-sm" style="color:#888;">🔤 字母发音练习</div><div class="letter-display">${p.letter}</div><button class="btn small blue" onclick="speakWord('${p.letter}')">🔊 听字母发音</button><p style="font-weight:600;margin-top:12px;">选择这个字母的常规发音：</p>${p.options.map((o,i)=>`<button class="option-btn" onclick="handlePC(${i},${p.correct},this,'${p.phonetic}')"><span class="phonetic-option">${o}</span></button>`).join('')}`; }
window.handlePC=function(sel,cor,el,correctText){if(qAnswered)return;attempts++;if(sel===cor){qAnswered=true;clearTimeout(qTimeout);correctCount++;el.classList.add('correct');speakWord(correctText.replace(/\//g,''));showFB('success','✅ 正确！');showNextB();}else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500);qAtt++;if(qAtt>=MAX_ATT)skipQ('已达最大尝试次数');else showFB('error',`❌ 剩余${MAX_ATT-qAtt}次`);}};

// ---------- 跟读回放 ----------
function showRepeatQ(w){ const area=document.getElementById('questionArea'); area.innerHTML=`<div class="text-sm" style="color:#888;">🎙️ 跟读回放</div><p style="font-size:1.3rem;font-weight:700;color:#2962FF;margin:12px 0;">${w[0]}</p><p style="color:#888;">${w[1]}</p><button class="btn small blue" onclick="speakWord('${w[0]}')">🔊 听标准发音</button><div style="margin:12px 0;"><button class="btn small" id="btnStartRecord" onclick="startRecording()">🔴 开始录音</button><button class="btn small gray hidden" id="btnStopRecord" onclick="stopRecording()">⏹ 停止录音</button><button class="btn small green hidden" id="btnPlayRecord" onclick="playRecording()">▶️ 回放我的录音</button></div><p class="text-xs" style="color:#888;" id="recordStatus">点击"开始录音"后朗读单词</p><button class="btn small blue mt-8" onclick="markRepeatDone('${w[0]}')">✅ 完成跟读</button>`; window._repeatWord=w[0]; }
function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert('你的浏览器不支持录音功能，请使用Chrome浏览器'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRecorder=new MediaRecorder(stream); audioChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{recordedAudio=new Blob(audioChunks,{type:'audio/webm'});document.getElementById('btnPlayRecord').classList.remove('hidden');document.getElementById('recordStatus').textContent='录音完成！点击回放试听';};
    mediaRecorder.start();
    document.getElementById('btnStartRecord').classList.add('hidden');
    document.getElementById('btnStopRecord').classList.remove('hidden');
    document.getElementById('recordStatus').textContent='🔴 正在录音……';
  }).catch(()=>{alert('无法访问麦克风，请检查浏览器权限');});
}
function stopRecording(){ if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();document.getElementById('btnStopRecord').classList.add('hidden');document.getElementById('btnStartRecord').classList.remove('hidden');} }
function playRecording(){ if(recordedAudio){ const url=URL.createObjectURL(recordedAudio); const a=new Audio(url); a.play(); } }
function markRepeatDone(word){ if(qAnswered)return; qAnswered=true; correctCount++; attempts++; clearTimeout(qTimeout); speakWord(word); showFB('success','✅ 跟读完成！对比标准发音和你的录音'); showNextB(); }

// ==================== 通用 ====================
function showSyl(w){ const area=document.getElementById('questionArea'); const ex=area.querySelector('.syllable-box'); if(ex)ex.remove(); const box=document.createElement('div'); box.className='syllable-box'; box.innerHTML=`<div style="font-size:0.75rem;color:#888;">✅ 正确！</div><div style="font-size:1.3rem;letter-spacing:3px;">${w[2]}</div><div class="phonetic-text">/${w[3]}/</div><div style="font-size:0.9rem;color:#555;">${w[0]} — ${w[1]}</div><button class="btn small blue mt-8" onclick="speakWord('${w[0]}')">🔊 再听</button>`; area.appendChild(box); }
function showFB(t,m){ document.getElementById('feedbackArea').innerHTML=`<div class="feedback-bar ${t==='success'?'success':t==='error'?'error':'info'}">${m}</div>`; }
function showNextB(){ document.getElementById('btnNextQuestion').style.display='block'; const totalQ=currentType==='dialogue'||currentType==='phonics'||currentType==='repeat'?6:Q_PER_ROUND; document.getElementById('btnNextQuestion').textContent=currentIdx>=totalQ-1?'➡️ 查看成绩':'➡️ 下一组'; document.getElementById('btnNextQuestion').onclick=()=>{currentIdx++;updateProg();const totalQ2=currentType==='dialogue'||currentType==='phonics'||currentType==='repeat'?6:Q_PER_ROUND;if(currentIdx>=totalQ2)endGame();else loadNextQ();}; }
function skipQ(reason){ if(qAnswered)return; qAnswered=true; clearTimeout(qTimeout); if(currentType==='dialogue'){ const d=currentWords[currentIdx]; if(d){speakWord(d.options[d.correct]);showFB('info',`ℹ️ ${reason}。正确答案：${d.options[d.correct]}`);} }
  else if(currentType==='phonics'){ const p=currentWords[currentIdx]; if(p){speakWord(p.phonetic.replace(/\//g,''));showFB('info',`ℹ️ ${reason}。正确答案：${p.phonetic}`);} }
  else if(currentType==='repeat'){ const w=currentWords[currentIdx]; if(w){speakWord(w[0]);showFB('info',`ℹ️ ${reason}。标准发音已播放`);} }
  else { const w=currentWords[currentIdx]; if(w){showSyl(w);speakWord(w[0]);showFB('info',`ℹ️ ${reason}。正确答案：${w[0]} — ${w[1]}`);recordErrW(w);} }
  showNextB(); }
function recordErrW(w){ if(!w||student==='Guest')return; setWordHistory(student,w[0]||'',false); const k=`daily_${student}_review`,l=LS.get(k,[]); const key=w[0]||''; const ex=l.find(x=>x.en===key); if(ex)ex.count++;else l.push({en:key,zh:w[1]||'',count:1,date:new Date().toISOString().split('T')[0]}); LS.set(k,l); }
function updateProg(){ const totalQ=currentType==='dialogue'||currentType==='phonics'||currentType==='repeat'?6:Q_PER_ROUND; document.getElementById('matchCount').textContent=`${currentIdx}/${totalQ}`; document.getElementById('progressFill').style.width=`${(currentIdx/totalQ)*100}%`; }
function endGame(){ clearInterval(timerId); clearTimeout(qTimeout); const acc=correctCount/Math.max(1,attempts); let stars=acc>=1.0?3:acc>=0.7?2:1, energy=stars===3?10:stars===2?5:2; if(student!=='Guest'){const k=`daily_${student}_energy`;LS.set(k,LS.get(k,0)+energy);} document.getElementById('starsDisplay').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars); document.getElementById('accuracyValue').textContent=Math.round(acc*100)+'%'; document.getElementById('energyValue').textContent='+'+energy; const totalE=student!=='Guest'?LS.get(`daily_${student}_energy`,0):0; document.getElementById('rankText').textContent=totalE>=500?'🥇金牌选手':totalE>=300?'🥈银牌选手':totalE>=100?'🥉铜牌选手':'🌱继续加油'; document.getElementById('resultModal').classList.remove('hidden'); }
function showLB(){ document.getElementById('noraScore').textContent=LS.get('daily_Nora_energy',0); document.getElementById('joenScore').textContent=LS.get('daily_Joen_energy',0); document.getElementById('leaderboardModal').classList.remove('hidden'); }
function showRV(){ const l=LS.get(`daily_${student}_review`,[]),el=document.getElementById('reviewList'); el.innerHTML=l.length===0?'<p>暂无错题 ✨</p>':l.map((w,i)=>`<p>${i+1}. <strong>${w.en}</strong> — ${w.zh} (×${w.count})</p>`).join(''); document.getElementById('reviewModal').classList.remove('hidden'); }

// ===================== 初始化 =====================
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('btnNora').onclick=()=>showTypeSelect('Nora');
  document.getElementById('btnJoen').onclick=()=>showTypeSelect('Joen');
  document.getElementById('btnGuest').onclick=()=>showTypeSelect('Guest');
  document.getElementById('btnBackToLogin').onclick=()=>{document.getElementById('typeSelectScreen').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');clearInterval(timerId);};
  document.getElementById('btnBackToTypeSelect').onclick=()=>{document.getElementById('gameScreen').classList.add('hidden');document.getElementById('typeSelectScreen').classList.remove('hidden');clearInterval(timerId);clearTimeout(qTimeout);};
  document.getElementById('btnPlayAgain').onclick=()=>{document.getElementById('resultModal').classList.add('hidden');document.getElementById('gameScreen').classList.add('hidden');document.getElementById('typeSelectScreen').classList.remove('hidden');};
  document.getElementById('btnResultClose').onclick=()=>{document.getElementById('resultModal').classList.add('hidden');document.getElementById('gameScreen').classList.add('hidden');document.getElementById('typeSelectScreen').classList.remove('hidden');};
  document.getElementById('btnTeacherEntry').onclick=()=>{document.getElementById('passwordModal').classList.remove('hidden');};
});
</script>
