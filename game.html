  <style>
    :root {
      --primary: #4DA8E8;
      --accent: #FFD200;
      --bg: #FFFFFF;
      --text: #1E2B3C;
      --card-bg-en: #E6F4FF;
      --card-bg-zh: #FFF8E6;
      --success: #4CAF50;
      --error: #F44336;
      --shadow: 0 3px 12px rgba(0,0,0,0.08);
      --radius: 16px;
      --gap: 12px;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #F8FAFC 0%, #E6F4FF 100%);
      color: var(--text);
      line-height: 1.5;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
      overflow-x: hidden;
      text-rendering: optimizeLegibility;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin: 12px 0 20px;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo-icon {
      font-size: 26px;
      color: var(--accent);
    }
    .student-info {
      text-align: center;
      font-weight: 600;
      margin: 8px 0;
      font-size: 17px;
      color: var(--primary);
    }
    .timer-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 14px;
      color: #666;
    }
    .progress-bar {
      height: 6px;
      background: #E0E7FF;
      border-radius: 3px;
      overflow: hidden;
      flex: 1;
      margin: 0 12px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
      margin: 20px 0;
    }
    @media (min-width: 480px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .card {
      aspect-ratio: 4/3;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      background: white;
      color: var(--text);
      text-align: center;
      line-height: 1.3;
      user-select: none;
      transform: scale(1);
    }
    .card.en {
      background: var(--card-bg-en);
      color: #2962FF;
    }
    .card.zh {
      background: var(--card-bg-zh);
      color: #E65100;
    }
    .card.selected {
      transform: scale(0.95);
      box-shadow: 0 0 0 3px var(--primary), 0 4px 12px rgba(77, 168, 232, 0.3);
    }
    .card.matched {
      opacity: 0.3;
      transform: scale(0.85);
      background: var(--success);
      color: white !important;
      animation: fadeOut 0.5s forwards;
    }
    .card.error {
      animation: shake 0.5s ease-in-out;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.7); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      margin: 8px 4px;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(77, 168, 232, 0.3);
      letter-spacing: 0.5px;
    }
    .btn:hover {
      background: #3a8fd9;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(77, 168, 232, 0.4);
    }
    .btn.accent {
      background: var(--accent);
      color: var(--text);
    }
    .btn.accent:hover {
      background: #e6be00;
    }
    .btn:active {
      transform: translateY(0);
    }
    .instructions {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 24px;
      padding: 12px;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: white;
      border-radius: var(--radius);
      width: 90%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.3s ease;
      position: relative;
      animation: popIn 0.35s forwards;
    }
    @keyframes popIn {
      to { transform: scale(1); }
    }
    .modal h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: var(--primary);
    }
    .stars {
      font-size: 32px;
      margin: 16px 0;
      height: 40px;
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .star {
      color: #FFC107;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 15px;
      color: #333;
    }
    .stat-item {

    }
    .stat-value {
      font-weight: 700;

    .rank-badge {

    .leaderboard {

    .player-row {

    }

    }
    .player-name {

      color: #333;
    }

    }
    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
      font-style: italic;
    }
    /* Login Screen */
    .login-screen {
      text-align: center;
      padding: 40px 20px;
    }

      font-size: 26px;
      margin-bottom: 32px;
      color: var(--primary);
    }
    .login-btns {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Responsive tweaks */
    @media (max-width: 420px) {
      .container { padding: 12px; }
      h1 { font-size: 22px; }
      .card { font-size: 16px; }
      .btn { padding: 12px 20px; font-size: 16px; }
    }
  </style>

  <script>
    // ======================
    // 🔑 CORE DATA & STORAGE
    // ======================
    const VOCAB = [
      ['hello','你好'], ['goodbye','再见'], ['hi','嗨'], ['bye','拜拜'],
      ['good morning','早上好'], ['good afternoon','下午好'], ['good evening','晚上好'], ['good night','晚安'],
      ['one','一'], ['two','二'], ['three','三'], ['four','四'], ['five','五'],
      ['six','六'], ['seven','七'], ['eight','八'], ['nine','九'], ['ten','十'],
      ['red','红色'], ['blue','蓝色'], ['yellow','黄色'], ['green','绿色'],
      ['orange','橙色'], ['purple','紫色'], ['pink','粉色'], ['white','白色'],
      ['black','黑色'], ['brown','棕色'], ['what','什么'], ['your','你的'],
      ['name','名字'], ['my','我的'], ['is','是'], ['I','我'], ['am','是'],
      ['how','怎样'], ['are','是'], ['you','你'], ['fine','好的'],
      ['thank','谢谢'], ['thanks','多谢'], ['please','请'], ['sorry','对不起'],
      ['yes','是'], ['no','不'], ['number','数字'], ['colour','颜色']
    ];

    const STORAGE_KEYS = {
      noraEnergy: 'daily_english_nora_energy',
      joenEnergy: 'daily_english_joen_energy',
      noraReview: 'daily_english_nora_review',
      joenReview: 'daily_english_joen_review',
      noraHistory: 'daily_english_nora_history',
      joenHistory: 'daily_english_joen_history'
    };

    const LS = {
      get(key, def = null) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : def;
        } catch (e) {
          console.warn('LS get error:', e);
          return def;
        }
      },
      set(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {
          console.warn('LS set error:', e);
        }
      }
    };

    // Initialize storage defaults
    if (LS.get(STORAGE_KEYS.noraEnergy) === null) LS.set(STORAGE_KEYS.noraEnergy, 0);
    if (LS.get(STORAGE_KEYS.joenEnergy) === null) LS.set(STORAGE_KEYS.joenEnergy, 0);
    if (LS.get(STORAGE_KEYS.noraReview) === null) LS.set(STORAGE_KEYS.noraReview, []);
    if (LS.get(STORAGE_KEYS.joenReview) === null) LS.set(STORAGE_KEYS.joenReview, []);
    if (LS.get(STORAGE_KEYS.noraHistory) === null) LS.set(STORAGE_KEYS.noraHistory, []);
    if (LS.get(STORAGE_KEYS.joenHistory) === null) LS.set(STORAGE_KEYS.joenHistory, []);

    // ======================
    // 🎙️ SPEECH MODULE (FIXED)
    // ======================
    const Speech = {
      synth: null,
      utterance: null,
      isActivated: false,
      queue: [],
      init() {
        if ('speechSynthesis' in window) {
          this.synth = window.speechSynthesis;
          if (this.synth.getVoices().length !== 0) {
            this.loadVoices();
          } else {
            this.synth.onvoiceschanged = () => this.loadVoices();
          }
        }
      },
      loadVoices() {
        const voices = this.synth.getVoices();
        this.voice = voices.find(v => v.lang === 'en-GB' && v.name.includes('English')) ||
                     voices.find(v => v.lang === 'en-US') ||
                     voices[0] || null;
        console.log('✅ Speech voices loaded:', this.voice?.name || 'default');
      },
      activate() {
        if (this.isActivated) return;
        try {
          const dummy = new SpeechSynthesisUtterance('');
          dummy.volume = 0;
          this.synth.speak(dummy);
          this.synth.cancel();
          this.isActivated = true;
          document.getElementById('speech-notice')?.style.display = 'none';
          console.log('✅ Speech activated');
        } catch (e) {
          console.error('🔊 Activation failed:', e);
          this.showFallbackAlert();
        }
      },
      speak(text, options = {}) {
        if (!this.isActivated || !this.synth || !text?.trim()) return;
        if (this.utterance && this.synth.speaking) this.synth.cancel();
        this.utterance = new SpeechSynthesisUtterance(text.trim());
        this.utterance.voice = this.voice || null;
        this.utterance.rate = options.rate ?? 0.85;
        this.utterance.pitch = options.pitch ?? 1;
        this.utterance.volume = options.volume ?? 0.9;
        this.utterance.lang = 'en-GB';
        this.utterance.onend = () => {
          if (this.queue.length > 0) {
            const next = this.queue.shift();
            setTimeout(() => this.speak(next.text, next.options), 300);
          }
        };
        this.utterance.onerror = (e) => {
          console.error('🔊 Speech error:', e);
          if (text && !text.includes(' ')) {
            this.speak(`单词是：${text}`, { rate: 0.8 });
          }
        };
        this.synth.speak(this.utterance);
      },
      queueSpeak(text, options = {}) {
        this.queue.push({ text, options });
        if (!this.synth.speaking && this.queue.length === 1) {
          this.speak(text, options);
        }
      },
      showFallbackAlert() {
        const el = document.createElement('div');
        el.className = 'modal';
        el.innerHTML = `
          <div class="modal-content" style="max-width:360px;padding:20px;">
            <h2>⚠️ 语音提示</h2>
            <p style="margin:16px 0;">你的浏览器暂不支持英文朗读<br>但游戏照常进行！</p>
            <button class="btn accent">我知道了</button>
          </div>
        `;
        document.body.appendChild(el);
        el.classList.add('active');
        el.querySelector('button').onclick = () => el.remove();
      }
    };

    // ======================
    // 🎤 FOLLOW-ALONG SCORING (FIXED)
    // ======================
    const FollowAlong = {
      recognition: null,
      isListening: false,
      currentWord: '',
      startTime: 0,
      endTime: 0,
      phonemeMap: {
        'hello': ['h', 'e', 'l', 'o'], 'hi': ['h', 'aɪ'], 'bye': ['b', 'aɪ'],
        'red': ['r', 'ɛ', 'd'], 'blue': ['b', 'l', 'uː'], 'yellow': ['j', 'ɛ', 'l', 'oʊ'],
        'one': ['w', 'ʌ', 'n'], 'two': ['t', 'uː'], 'three': ['θ', 'r', 'iː'],
        'what': ['w', 'ɒ', 't'], 'name': ['n', 'eɪ', 'm'], 'my': ['m', 'aɪ'],
        'is': ['ɪ', 'z'], 'I': ['aɪ'], 'am': ['æ', 'm'], 'how': ['h', 'aʊ'],
        'are': ['ɑːr'], 'you': ['j', 'uː'], 'fine': ['f', 'aɪ', 'n'],
        'thank': ['θ', 'æ', 'ŋ'], 'thanks': ['θ', 'æ', 'ŋ', 'k', 's'],
        'please': ['p', 'l', 'iː', 'z'], 'sorry': ['s', 'ɒ', 'r', 'i'],
        'yes': ['j', 'ɛ', 's'], 'no': ['n', 'əʊ'], 'number': ['n', 'ʌ', 'm', 'b', 'ə'],
        'colour': ['k', 'ʌ', 'l', 'ə']
      },

      init() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          this.recognition = new SpeechRecognition();
          this.recognition.continuous = false;
          this.recognition.interimResults = false;
          this.recognition.lang = 'en-GB';
          this.recognition.maxAlternatives = 1;

          this.recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim().toLowerCase();
            this.endTime = Date.now();
            this.scorePronunciation(transcript);
          };

          this.recognition.onerror = (event) => {
            console.warn('🎤 Recognition error:', event.error);
            this.showFeedback('⚠️ 请再试一次，或点击【听我读】听示范', 'warn');
          };

          this.recognition.onend = () => {
            this.isListening = false;
          };

          console.log('✅ FollowAlong: SpeechRecognition available');
        } else {
          console.warn('❌ FollowAlong: SpeechRecognition NOT supported');
          document.getElementById('follow-along-btn')?.remove();
        }
      },

      start(word) {
        if (!this.recognition) {
          this.showFeedback('❌ 你的设备不支持跟读评分', 'error');
          return;
        }
        if (this.isListening) return;

        this.currentWord = word.toLowerCase();
        this.startTime = Date.now();
        this.isListening = true;

        try {
          this.recognition.start();
          this.showFeedback(`🎤 请大声读出：${word}！`, 'recording');
          setTimeout(() => {
            if (this.isListening && this.recognition) {
              this.recognition.stop();
              this.showFeedback('⏰ 时间到，请再试一次', 'warn');
            }
          }, 3000);
        } catch (e) {
          console.error('🎤 Start failed:', e);
          this.showFeedback('❌ 请允许麦克风权限（点浏览器地址栏锁图标→允许）', 'error');
          this.isListening = false;
        }
      },

      scorePronunciation(transcript) {
        const word = this.currentWord;
        const refPhonemes = this.phonemeMap[word] || [];
        const userPhonemes = this.transcriptToPhonemes(transcript);

        let clarity = 0;
        let durationScore = 0;
        let accuracy = 0;

        if (refPhonemes.length > 0 && userPhonemes.length > 0) {
          const matched = refPhonemes.filter(p => userPhonemes.some(up => this.similarPhoneme(p, up)));
          clarity = Math.round((matched.length / refPhonemes.length) * 100);
        }

        const idealMs = Math.max(800, refPhonemes.length * 400);
        const actualMs = this.endTime - this.startTime;
        durationScore = Math.max(0, Math.min(100, 100 - Math.abs(actualMs - idealMs) / 10));

        const cleanRef = word.replace(/[^a-z]/g, '');
        const cleanUser = transcript.replace(/[^a-z]/g, '');
        accuracy = this.stringSimilarity(cleanRef, cleanUser);

        const finalScore = Math.round(
          clarity * 0.4 +
          durationScore * 0.3 +
          accuracy * 0.3
        );

        let stars = '⭐';
        if (finalScore >= 90) stars = '🌟';
        else if (finalScore >= 75) stars = '✨';

        const encouragements = [
          `你把 ${word} 发得像 Toby 老师一样棒！`,
          `太棒了！${word} 就是这样读的！`,
          `发音清晰又自信，继续加油！`,
          `Wow! ${word} 说得超标准～`,
          `👍 你已经掌握 ${word} 的秘密发音啦！`
        ];
        const msg = `${stars} ${encouragements[Math.floor(Math.random() * encouragements.length)]}`;

        this.showFeedback(msg, 'success', finalScore);
      },

      transcriptToPhonemes(transcript) {
        const map = {
          'hello': ['h', 'e', 'l', 'o'], 'hi': ['h', 'aɪ'], 'bye': ['b', 'aɪ'],
          'red': ['r', 'ɛ', 'd'], 'blue': ['b', 'l', 'uː'], 'yellow': ['j', 'ɛ', 'l', 'oʊ'],
          'one': ['w', 'ʌ', 'n'], 'two': ['t', 'uː'], 'three': ['θ', 'r', 'iː'],
          'what': ['w', 'ɒ', 't'], 'name': ['n', 'eɪ', 'm'], 'my': ['m', 'aɪ'],
          'is': ['ɪ', 'z'], 'i': ['aɪ'], 'am': ['æ', 'm'], 'how': ['h', 'aʊ'],
          'are': ['ɑːr'], 'you': ['j', 'uː'], 'fine': ['f', 'aɪ', 'n'],
          'thank': ['θ', 'æ', 'ŋ'], 'thanks': ['θ', 'æ', 'ŋ', 'k', 's'],
          'please': ['p', 'l', 'iː', 'z'], 'sorry': ['s', 'ɒ', 'r', 'i'],
          'yes': ['j', 'ɛ', 's'], 'no': ['n', 'əʊ'], 'number': ['n', 'ʌ', 'm', 'b', 'ə'],
          'colour': ['k', 'ʌ', 'l', 'ə']
        };
        return (map[transcript] || []).concat(
          Array.from(transcript).filter(c => /[bcdfghjklmnpqrstvwxyz]/i.test(c)).map(c => c.toLowerCase())
        );
      },

      similarPhoneme(a, b) {
        const groups = [
          ['t', 'd'], ['s', 'z'], ['k', 'g'], ['p', 'b'], ['f', 'v'], ['θ', 'ð'],
          ['r', 'l'], ['j', 'y'], ['w', 'u'], ['i', 'ɪ', 'iː'], ['e', 'ɛ', 'eɪ'],
          ['a', 'æ', 'ɑː', 'ʌ', 'ə'], ['o', 'ɔː', 'oʊ', 'əʊ'], ['u', 'uː', 'ʊ']
        ];
        return a === b || groups.some(g => g.includes(a) && g.includes(b));
      },

      stringSimilarity(a, b) {
        const la = a.length, lb = b.length;
        if (la === 0 && lb === 0) return 100;
        if (la === 0 || lb === 0) return 0;
        const d = [];
        for (let i = 0; i <= la; i++) d[i] = [i];
        for (let j = 0; j <= lb; j++) d[0][j] = j;
        for (let i = 1; i <= la; i++) {
          for (let j = 1; j <= lb; j++) {
            d[i][j] = Math.min(
              d[i-1][j] + 1,
              d[i][j-1] + 1,
              d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
            );
          }
        }
        return Math.round(100 - (d[la][lb] / Math.max(la, lb)) * 100);
      },

      showFeedback(text, type, score = null) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
          <div class="modal-content" style="max-width:360px;padding:20px;">
            <h2 style="margin-top:0;">🎙️ 跟读评分</h2>
            <div style="font-size:20px;margin:16px 0;height:36px;display:flex;align-items:center;justify-content:center;">
              ${score !== null ? `<span style="font-weight:bold;color:#4DA8E8;">${score}/100</span>` : ''}
            </div>
            <p style="font-size:16px;line-height:1.6;text-align:center;margin:12px 0;">
              ${text}
            </p>
            ${score !== null ? `
            <div style="margin:20px 0;text-align:center;">
              <div style="display:inline-block;background:#FFD200;color:#1E2B3C;font-weight:bold;padding:6px 16px;border-radius:20px;font-size:15px;">
                ${score >= 90 ? '🏆 发音大师' : score >= 75 ? '🎯 进步飞快' : '🌱 继续练习'}
              </div>
            </div>
            ` : ''}
            <button class="btn accent" id="feedback-close">好的！</button>
          </div>
        `;
        document.body.appendChild(modal);
        modal.classList.add('active');

        document.getElementById('feedback-close').addEventListener('click', () => {
          modal.remove();
        });
      }
    };

    // ======================
    // 🎮 GAME ENGINE (FULLY FIXED)
    // ======================
    let currentStudent = 'Nora';
    let gameData = null;
    let selectedCards = [];
    let matchedCount = 0;
    let startTime = null;
    let timerInterval = null;
    let gameActive = false;

    function startGame(student) {
      currentStudent = student;
      document.getElementById('student-name').textContent = student === 'Nora' ? 'Nora（吴雨萌）' : 'Joen（柯祖恩）';
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';

      selectedCards = [];
      matchedCount = 0;
      gameActive = true;
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('timer').textContent = '00:00';
      clearInterval(timerInterval);

      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);

      const shuffled = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 6);
      const cards = [];
      for (const [en, zh] of shuffled) {
        cards.push({ type: 'en', word: en, meaning: zh, id: Math.random() });
        cards.push({ type: 'zh', word: zh, meaning: en, id: Math.random() });
      }
      gameData = shuffle(cards);

      renderGrid();
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]]];
      }
      return array;
    }

    function renderGrid() {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = '';
      gameData.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = `card ${card.type}`;
        el.textContent = card.word;
        el.dataset.index = idx;
        el.dataset.type = card.type;
        el.dataset.word = card.word;
        el.dataset.meaning = card.meaning;
        el.addEventListener('click', () => handleCardClick(el));
        grid.appendChild(el);
      });

      const btn = document.createElement('button');
      btn.id = 'follow-along-btn';
      btn.className = 'btn';
      btn.textContent = '🎤 跟我读';
      btn.style.cssText = 'background:#81C784; margin-top:12px; width:100%;';
      btn.addEventListener('click', () => {
        if (selectedCards.length === 1 && selectedCards[0].card.type === 'en') {
          const word = selectedCards[0].card.word;
          FollowAlong.start(word);
        } else {
          FollowAlong.showFeedback('👉 请先点一个英文单词！', 'warn');
        }
      });
      grid.parentNode.insertBefore(btn, grid.nextSibling);
    }

    function handleCardClick(cardEl) {
      if (!gameActive || cardEl.classList.contains('matched') || cardEl.classList.contains('error')) return;

      const idx = parseInt(cardEl.dataset.index);
      const card = gameData[idx];

      if (selectedCards.length === 0) {
        if (card.type === 'en') {
          selectedCards.push({ el: cardEl, card });
          cardEl.classList.add('selected');
        }
      } else if (selectedCards.length === 1) {
        if (card.type === 'zh') {
          const first = selectedCards[0];
          selectedCards.push({ el: cardEl, card });

          const isMatch = first.card.meaning === card.word;
          if (isMatch) {
            first.el.classList.add('matched');
            cardEl.classList.add('matched');
            matchedCount++;
            document.getElementById('progress-fill').style.width = `${(matchedCount / 6) * 100}%`;
            
            if (Speech.isActivated) {
              Speech.speak(card.meaning, { rate: 0.85 });
            }

            selectedCards = [];
            if (matchedCount === 6) {
              endGame(true);
            }
          } else {
            first.el.classList.add('error');
            cardEl.classList.add('error');
            setTimeout(() => {
              first.el.classList.remove('selected', 'error');
              cardEl.classList.remove('error');
              selectedCards = [];
            }, 500);

            const reviewItem = {
              en: card.meaning,
              zh: card.word,
              date: new Date().toISOString().split('T')[0],
              count: 1
            };
            const key = currentStudent === 'Nora' ? STORAGE_KEYS.noraReview : STORAGE_KEYS.joenReview;
            const list = LS.get(key, []);
            const existing = list.find(i => i.en === reviewItem.en && i.zh === reviewItem.zh);
            if (existing) {
              existing.count++;
              existing.date = reviewItem.date;
            } else {
              list.push(reviewItem);
            }
            LS.set(key, list);
          }
        }
      }
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      document.getElementById('timer').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function endGame(isWin) {
      clearInterval(timerInterval);
      gameActive = false;

      const totalAttempts = 6 + (6 - matchedCount);
      const accuracy = isWin ? 100 : Math.round((6 / totalAttempts) * 100);

      let stars = 1;
      if (accuracy === 100) stars = 3;
      else if (accuracy >= 70) stars = 2;

      let energy = 0;
      if (stars === 3) energy = 10;
      else if (stars === 2) energy = 5;
      else energy = 2;

      const historyItem = {
        date: new Date().toISOString().split('T')[0],
        stars,
        accuracy,
        energy,
        time: document.getElementById('timer').textContent
      };
      const histKey = currentStudent === 'Nora' ? STORAGE_KEYS.noraHistory : STORAGE_KEYS.joenHistory;
      const hist = LS.get(histKey, []);
      hist.push(historyItem);
      LS.set(histKey, hist);

      const energyKey = currentStudent === 'Nora' ? STORAGE_KEYS.noraEnergy : STORAGE_KEYS.joenEnergy;
      const currentEnergy = LS.get(energyKey, 0);
      LS.set(energyKey, currentEnergy + energy);

      const totalEnergy = currentEnergy + energy;
      let rankText = '新手';
      let rankClass = 'rank-newbie';
      if (totalEnergy >= 500) {
        rankText = '🥇 金牌选手';
        rankClass = 'rank-gold';
      } else if (totalEnergy >= 300) {
        rankText = '🥈 银牌选手';
        rankClass = 'rank-silver';
      } else if (totalEnergy >= 100) {
        rankText = '🥉 铜牌选手';
        rankClass = 'rank-bronze';
      }

      document.getElementById('stars-display').innerHTML = '⭐'.repeat(stars);
      document.getElementById('rank-text').innerHTML = `<span class="rank-badge ${rankClass}">${rankText}</span>`;
      document.getElementById('accuracy-value').textContent = `${accuracy}%`;
      document.getElementById('energy-value').textContent = `+${energy}`;
      document.getElementById('result-modal').classList.add('active');
    }

    // ======================
    // 🏆 LEADERBOARD & REVIEW
    // ======================
    function updateLeaderboard() {
      document.getElementById('nora-score').textContent = LS.get(STORAGE_KEYS.noraEnergy, 0);
      document.getElementById('joen-score').textContent = LS.get(STORAGE_KEYS.joenEnergy, 0);
    }

    function updateReviewList() {
      const key = currentStudent === 'Nora' ? STORAGE_KEYS.noraReview : STORAGE_KEYS.joenReview;
      const list = LS.get(key, []);
      const el = document.getElementById('review-list');
      if (list.length === 0) {
        el.innerHTML = '<p>暂无错题，继续保持！✨</p>';
        return;
      }
      el.innerHTML = list.map((item, i) => 
        `<div style="padding:8px 0;border-bottom:1px dashed #eee;">${i+1}. <strong>${item.en}</strong> — ${item.zh} <span style="float:right;color:#888;font-size:13px;">×${item.count}</span></div>`
      ).join('');
    }

    // ======================
    // 🚀 INIT & EVENT LISTENERS (FIXED)
    // ======================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Daily English loading...');

      Speech.init();
      FollowAlong.init();

      const noraBtn = document.getElementById('nora-btn');
      const joenBtn = document.getElementById('joen-btn');
      if (noraBtn) {
        noraBtn.addEventListener('click', () => {
          console.log('🎮 Starting game for Nora');
          startGame('Nora');
        });
      }
      if (joenBtn) {
        joenBtn.addEventListener('click', () => {
          console.log('🎮 Starting game for Joen');
          startGame('Joen');
        });
      }

      const activateBtn = document.getElementById('speech-activate-btn');
      if (activateBtn) {
        activateBtn.addEventListener('click', () => {
          console.log('🔊 Activating speech...');
          Speech.activate();
        });
      }

      const lbBtn = document.getElementById('leaderboard-btn');
      if (lbBtn) {
        lbBtn.addEventListener('click', () => {
          updateLeaderboard();
          document.getElementById('leaderboard-modal').classList.add('active');
        });
      }
      document.getElementById('close-leaderboard')?.addEventListener('click', () => {
        document.getElementById('leaderboard-modal').classList.remove('active');
      });

      const rvBtn = document.getElementById('review-btn');
      if (rvBtn) {
        rvBtn.addEventListener('click', () => {
          updateReviewList();
          document.getElementById('review-modal').classList.add('active');
        });
      }
      document.getElementById('close-review')?.addEventListener('click', () => {
        document.getElementById('review-modal').classList.remove('active');
      });

      document.getElementById('play-again')?.addEventListener('click', () => {
        document.getElementById('result-modal').classList.remove('active');
        startGame(currentStudent);
      });
      document.getElementById('back-to-menu')?.addEventListener('click', () => {
        document.getElementById('result-modal').classList.remove('active');
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'block';
      });

      document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', e => {
          if (e.target === modal) modal.classList.remove('active');
        });
      });

      console.log('✅ Daily English loaded successfully');
    });
  </script>
