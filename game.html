<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Daily English 极简测试</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    .screen {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 300px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #FFD200;
      color: #1E2B3C;
    }
    .btn:active { transform: scale(0.96); }
    h2 { margin-bottom: 8px; color: #4DA8E8; }
    p { margin: 16px 0; color: #555; }
  </style>
</head>
<body>

  <!-- 登录界面 -->
  <div id="loginScreen" class="screen">
    <h2>📘 Daily English</h2>
    <p>请选择你的名字</p>
    <button class="btn" id="btnNora">Nora（吴雨萌）</button>
    <button class="btn" id="btnJoen">Joen（柯祖恩）</button>
    <p style="font-size:12px; color:#999;">测试：点击按钮应切换到游戏界面</p>
  </div>

  <!-- 游戏界面（默认隐藏） -->
  <div id="gameScreen" class="screen" style="display:none;">
    <h2>🎮 游戏界面</h2>
    <p>当前学生：<strong id="studentName"></strong></p>
    <p style="font-size:14px; color:#999;">如果看到此界面，说明切换成功！</p>
    <button class="btn" onclick="location.reload()">返回登录页</button>
  </div>

  <script>
    // 等待页面加载完成后绑定事件
    document.addEventListener('DOMContentLoaded', function() {
      var btnNora = document.getElementById('btnNora');
      var btnJoen = document.getElementById('btnJoen');
      var loginScreen = document.getElementById('loginScreen');
      var gameScreen = document.getElementById('gameScreen');
      var studentName = document.getElementById('studentName');

      if (btnNora && btnJoen) {
        btnNora.onclick = function() {
          studentName.textContent = 'Nora（吴雨萌）';
          loginScreen.style.display = 'none';
          gameScreen.style.display = 'block';
        };
        btnJoen.onclick = function() {
          studentName.textContent = 'Joen（柯祖恩）';
          loginScreen.style.display = 'none';
          gameScreen.style.display = 'block';
        };
        // 在页面角落显示一个绿色圆点，表示脚本执行成功
        var dot = document.createElement('div');
        dot.style.cssText = 'position:fixed;top:10px;right:10px;width:12px;height:12px;border-radius:6px;background:#34C759;z-index:9999;';
        document.body.appendChild(dot);
      } else {
        alert('致命错误：按钮元素未找到，请检查HTML。');
      }
    });
  </script>
</body>
</html>
